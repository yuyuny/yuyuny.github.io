<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <p class="site-title"><a href="/">{{ site.title }}</a></p>
    <nav>
      [ <a href="/">Home</a> | <a href="/posts/">Posts</a> | <a href="/about/">About</a> ]
    </nav>
  </header>

  <main>
{{ content }}
  </main>

  <footer>
    <p><a href="https://github.com/yuyuny">GitHub</a> · <a href="mailto:yuyunykk@gmail.com">Email</a></p>
    <p>Last updated: {{ site.time | date: '%Y.%m.%d' }}</p>
  </footer>
</body>
</html>
