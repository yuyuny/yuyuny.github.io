<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script>
    // 첫 페인트 전에 저장된 테마를 적용해 깜빡임을 막는다
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="/site.js" defer></script>
</head>
<body>
{{ content }}
  <footer class="foot">
    <nav class="links" aria-label="바깥 링크">
      <a href="/french/"><span><small>/french</small>프랑스어 연습</span><i>↗</i></a>
      <a href="/radio/"><span><small>/radio</small>Kim's Radio Club</span><i>↗</i></a>
      <a href="https://github.com/yuyuny"><span><small>github.com</small>GitHub</span><i>↗</i></a>
    </nav>
    <p class="copy"><span>© {{ site.time | date: '%Y' }} Yun Kim</span><span>Last updated {{ site.time | date: '%Y.%m.%d' }}</span></p>
  </footer>

  <a class="radio" href="/radio/" title="킴스 라디오 클럽" aria-label="킴스 라디오 클럽">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="99" fill="#0b0b0b"/>
      <g fill="none" stroke="#2a2a2a"><circle cx="100" cy="100" r="90"/><circle cx="100" cy="100" r="81"/><circle cx="100" cy="100" r="72"/><circle cx="100" cy="100" r="63"/><circle cx="100" cy="100" r="54"/></g>
      <path d="M44 28 A90 90 0 0 1 118 12" stroke="rgba(255,255,255,.22)" stroke-width="8" fill="none"/>
      <path d="M156 172 A90 90 0 0 1 82 188" stroke="rgba(255,255,255,.1)" stroke-width="6" fill="none"/>
      <circle cx="100" cy="100" r="44" fill="#ff3d8b"/>
      <g transform="translate(69 68) scale(.97)" fill="#0b0b0b"><rect x="10" y="7" width="24" height="8"/><rect x="26" y="7" width="8" height="24"/><rect x="10" y="21" width="24" height="7"/><rect x="42" y="7" width="8" height="27"/><path fill-rule="evenodd" d="M14 40h36v17H14zM22 45h20v7H22z"/></g>
      <circle cx="100" cy="100" r="3" fill="#0b0b0b" stroke="#f7f3ea"/>
    </svg>
  </a>
</body>
</html>
