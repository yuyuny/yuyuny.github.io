---
layout: default
title: Posts
---
<h1>Posts</h1>
{% assign years = site.posts | group_by_exp: "post", "post.date | date: '%Y'" %}
{% for year in years %}
<h2>{{ year.name }}</h2>
<ul class="posts">
  {% for post in year.items %}
  <li><time datetime="{{ post.date | date: '%F' }}">{{ post.date | date: '%F' }}</time> <a href="{{ post.url }}">{{ post.title }}</a></li>
  {% endfor %}
</ul>
{% endfor %}
